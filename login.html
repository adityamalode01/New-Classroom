<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Classroom | Secure Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root{
  --primary:#6366f1;
  --secondary:#22d3ee;
  --accent:#f472b6;
  --dark:#020617;
  --light:#f8fafc;
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

html { scroll-behavior: smooth; }

/* ================= BODY ================= */
body{
  min-height: 100vh;
  min-height: 100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(180deg, #0a0a2a 0%, #020617 100%);
  overflow-x: hidden;
  overflow-y: auto;
  padding: 24px 16px;
  position: relative;
}

/* ================= BACKGROUND ================= */
canvas#energy{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events: none;
}

.gradient-orbs {
  position: fixed;
  width:200vw;
  height:200vh;
  top:-50vh;
  left:-50vw;
  z-index:-1;
  opacity:0.25;
  pointer-events: none;
}

.orb {
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  animation:float 20s infinite linear;
}

.orb-1 {
  width:500px;
  height:500px;
  background:radial-gradient(circle, var(--primary) 0%, transparent 70%);
  top:10%; left:10%;
  animation-duration:25s;
}

.orb-2 {
  width:600px;
  height:600px;
  background:radial-gradient(circle, var(--secondary) 0%, transparent 70%);
  top:60%; right:10%;
  animation-duration:30s;
  animation-delay:5s;
}

.orb-3 {
  width:400px;
  height:400px;
  background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
  bottom:10%; left:20%;
  animation-duration:35s;
  animation-delay:10s;
}

@keyframes float {
  0%   { transform:translate(0, 0) rotate(0deg); }
  25%  { transform:translate(100px, 50px) rotate(90deg); }
  50%  { transform:translate(50px, 100px) rotate(180deg); }
  75%  { transform:translate(-50px, 50px) rotate(270deg); }
  100% { transform:translate(0, 0) rotate(360deg); }
}

/* ================= GLASS CARD ================= */
.login-card{
  width: 100%;
  max-width: 420px;
  padding: 42px 32px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 30px 100px rgba(0,0,0,0.6);
  text-align: center;
  color: white;
  position: relative;
  z-index: 1;
}

.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
  border-radius: 28px 28px 0 0;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.login-card.shake {
  animation: shake 0.5s var(--ease);
}

.login-card h1{
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
}

.login-card p{
  opacity: 0.75;
  margin: 6px 0 34px;
  font-size: 0.95rem;
  color: rgba(255,255,255,0.7);
}

/* ================= INPUTS ================= */
.field{
  position: relative;
  margin-bottom: 24px;
}

.field input{
  width: 100%;
  /* Left padding for left icon, right padding for eye icon */
  padding: 16px 52px 16px 48px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: white;
  font-size: 1rem;
  outline: none;
  transition: all 0.35s var(--ease);
}

.field input:focus{
  background: rgba(255,255,255,0.09);
  border-color: var(--secondary);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
}

.field input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.field label{
  position: absolute;
  left: 48px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.85rem;
  color: #c7d2fe;
  pointer-events: none;
  transition: all 0.35s var(--ease);
}

.field input:focus + label,
.field input:valid + label{
  top: -10px;
  font-size: 0.7rem;
  background: #0a0a2a;
  padding: 0 8px;
  color: var(--secondary);
  border-radius: 4px;
}

/* =====================================================
   ✅ LEFT ICON (envelope / lock)
   ===================================================== */
.field i {
  position: absolute;
  top: 50%;
  left: 18px;
  transform: translateY(-50%);
  color: #a5b4fc;
  font-size: 1rem;
  line-height: 1;
  pointer-events: none;
  width: 1em;
  height: 1em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* =====================================================
   ✅ EYE ICON — FIXED: right side, perfectly centered
   Uses higher specificity (.field i.eye) to override .field i
   ===================================================== */
.field i.eye {
  position: absolute;
  top: 50%;
  right: 16px;
  left: auto;              /* ← overrides .field i left: 18px */
  transform: translateY(-50%);
  cursor: pointer;
  color: #a5b4fc;
  font-size: 1rem;
  line-height: 1;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.3s var(--ease);
  pointer-events: auto;
  z-index: 2;
}

.field i.eye:hover {
  color: var(--secondary);
  background: rgba(34, 211, 238, 0.1);
}

/* ================= OTP FIELD ================= */
.otp-field {
  display: none;
}

.otp-field.show {
  display: block;
}

.otp-inputs {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.otp-inputs input {
  width: 48px;
  height: 56px;
  padding: 0;
  text-align: center;
  font-size: 1.4rem;
  font-weight: 600;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: white;
  outline: none;
  transition: all 0.3s var(--ease);
  font-family: inherit;
}

.otp-inputs input:focus {
  border-color: var(--secondary);
  background: rgba(255,255,255,0.09);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
}

.otp-inputs input.filled {
  border-color: var(--secondary);
  background: rgba(34, 211, 238, 0.08);
}

.otp-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.75);
}

.otp-actions .back-link {
  color: var(--secondary);
  text-decoration: none;
  cursor: pointer;
  transition: opacity 0.3s var(--ease);
}

.otp-actions .back-link:hover {
  opacity: 0.8;
  text-decoration: underline;
}

.otp-timer {
  font-weight: 500;
  color: rgba(255,255,255,0.6);
}

.otp-timer strong {
  color: var(--secondary);
}

.resend-link {
  color: var(--secondary);
  text-decoration: none;
  cursor: pointer;
  font-weight: 500;
  transition: opacity 0.3s var(--ease);
}

.resend-link.disabled {
  color: rgba(255,255,255,0.35);
  pointer-events: none;
  cursor: not-allowed;
}

.resend-link:hover:not(.disabled) {
  opacity: 0.8;
  text-decoration: underline;
}

.otp-demo-banner {
  background: rgba(34, 211, 238, 0.08);
  border: 1px dashed rgba(34, 211, 238, 0.4);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 20px;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.otp-demo-banner i {
  color: var(--secondary);
  font-size: 1rem;
  /* Override .field i for demo banner */
  position: static;
  transform: none;
  width: auto;
  height: auto;
  left: auto;
}

.otp-demo-banner strong {
  color: var(--secondary);
  font-weight: 700;
  letter-spacing: 1px;
}

/* ================= REMEMBER + FORGOT ================= */
.row-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  font-size: 0.85rem;
  gap: 12px;
  color: rgba(255,255,255,0.75);
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  transition: color 0.3s var(--ease);
}

.remember:hover { color: white; }

.remember input {
  accent-color: var(--primary);
  cursor: pointer;
  width: 16px;
  height: 16px;
}

.forgot-link {
  color: var(--secondary);
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s var(--ease);
}

.forgot-link:hover {
  opacity: 0.8;
  text-decoration: underline;
}

/* ================= BUTTON ================= */
.login-btn{
  width: 100%;
  height: 52px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s var(--ease);
  box-shadow: 0 10px 25px rgba(99,102,241,0.3);
  font-family: inherit;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 35px rgba(99,102,241,0.4);
}

.login-btn:active {
  transform: translateY(0) scale(0.98);
}

.login-btn.loading{
  pointer-events: none;
  color: transparent;
}

.login-btn.loading::after{
  content: "";
  width: 24px;
  height: 24px;
  border: 3px solid white;
  border-top-color: transparent;
  border-radius: 50%;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: spin 0.8s linear infinite;
}

@keyframes spin{
  to{ transform: translate(-50%, -50%) rotate(360deg); }
}

/* ================= LINKS ================= */
.links{
  margin-top: 22px;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.7);
}

.links a{
  color: var(--secondary);
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s var(--ease);
}

.links a:hover{
  opacity: 0.8;
  text-decoration: underline;
}

/* ================= STATUS MESSAGE ================= */
.status-message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 0.9rem;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.status-message.show { display: flex; }

.status-message.success {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: #a7f3d0;
}

.status-message.error {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fecaca;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
  body { padding: 16px 12px; }

  .login-card { padding: 32px 22px; border-radius: 24px; }

  .login-card h1 { font-size: 1.75rem; }

  .login-card p { font-size: 0.85rem; margin: 4px 0 24px; }

  .field input { padding: 14px 46px 14px 44px; font-size: 0.95rem; }

  .field label { left: 44px; font-size: 0.8rem; }

  .field i { left: 16px; font-size: 0.95rem; }

  .field i.eye { right: 12px; width: 28px; height: 28px; font-size: 0.95rem; }

  .login-btn { height: 48px; font-size: 1rem; }

  .row-options { font-size: 0.8rem; margin-bottom: 20px; }

  .otp-inputs { gap: 6px; }
  .otp-inputs input {
    width: 42px;
    height: 50px;
    font-size: 1.2rem;
    border-radius: 12px;
  }
}

@media (max-width: 360px) {
  .login-card h1 { font-size: 1.5rem; }

  .row-options {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .otp-inputs { gap: 4px; }
  .otp-inputs input {
    width: 38px;
    height: 46px;
    font-size: 1.1rem;
  }
}
</style>
</head>

<body>

<!-- Background Orbs -->
<div class="gradient-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Energy Particles Canvas -->
<canvas id="energy"></canvas>

<!-- Login Card -->
<div class="login-card" id="card">
  <h1>Smart Login</h1>
  <p id="cardSubtitle">Secure access to your classroom</p>

  <!-- ============ STEP 1: Email + Password ============ -->
  <form id="loginForm" novalidate>

    <div class="field">
      <i class="fas fa-envelope"></i>
      <input type="email" id="email" required autocomplete="email" placeholder=" ">
      <label>Email Address</label>
    </div>

    <div class="field">
      <i class="fas fa-lock"></i>
      <input type="password" id="pass" required autocomplete="current-password" placeholder=" ">
      <label>Password</label>
      <i class="fas fa-eye eye" id="eyeIcon" onclick="togglePass()" title="Show password"></i>
    </div>

    <div class="row-options">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        Remember me
      </label>
      <a href="#" class="forgot-link" onclick="event.preventDefault(); forgotPassword();">
        Forgot password?
      </a>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      Login
    </button>

    <div class="status-message" id="statusMsg"></div>
  </form>

  <!-- ============ STEP 2: OTP Verification ============ -->
  <form id="otpForm" class="otp-field" novalidate>

    <div class="otp-demo-banner">
      <i class="fas fa-shield-alt"></i>
      <span>Demo OTP: <strong id="demoOtpDisplay">------</strong></span>
    </div>

    <div class="otp-inputs" id="otpInputs">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="0">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="1">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="2">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="3">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="4">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="5">
    </div>

    <div class="otp-actions">
      <a class="back-link" onclick="backToLogin()">
        <i class="fas fa-arrow-left"></i> Back
      </a>
      <span class="otp-timer" id="otpTimer">Resend in <strong>30</strong>s</span>
      <a class="resend-link disabled" id="resendLink" onclick="resendOtp()">
        Resend
      </a>
    </div>

    <button type="submit" class="login-btn" id="verifyBtn">
      Verify OTP
    </button>

    <div class="status-message" id="otpStatusMsg"></div>
  </form>

  <div class="links" id="linksSection">
    New here? <a href="signup.html">Create account</a>
  </div>
</div>

<script>
/* ================= ENERGY BACKGROUND ================= */
const canvas = document.getElementById("energy");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener('resize', resize);

const PARTICLE_COUNT = 60;
const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx: (Math.random() - 0.5) * 0.6,
  vy: (Math.random() - 0.5) * 0.6,
  size: Math.random() * 1.5 + 1
}));

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = "#6366f1";
    ctx.globalAlpha = 0.55;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

/* ================= PASSWORD TOGGLE ================= */
function togglePass() {
  const p = document.getElementById("pass");
  const icon = document.getElementById("eyeIcon");
  if (p.type === "password") {
    p.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
    icon.title = "Hide password";
  } else {
    p.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
    icon.title = "Show password";
  }
}

/* ================= STATUS MESSAGES ================= */
function showStatus(elId, message, type = "error") {
  const el = document.getElementById(elId);
  el.className = `status-message show ${type}`;
  const icon = type === "success" ? "check-circle" : "exclamation-circle";
  el.innerHTML = `<i class="fas fa-${icon}"></i><span>${message}</span>`;
  clearTimeout(window["_timer_" + elId]);
  if (type === "success") {
    window["_timer_" + elId] = setTimeout(() => el.classList.remove("show"), 3000);
  }
}

function hideStatus(elId) {
  document.getElementById(elId).classList.remove("show");
}

/* ================= STATE ================= */
let generatedOtp = "";
let currentUser = null;
let resendTimer = null;

/* ================= STEP 1: LOGIN SUBMIT ================= */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideStatus("statusMsg");

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("pass").value;

  if (!email || !password) {
    showStatus("statusMsg", "Please enter both email and password", "error");
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showStatus("statusMsg", "Please enter a valid email address", "error");
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.classList.add("loading");
  btn.disabled = true;
  document.getElementById("email").disabled = true;
  document.getElementById("pass").disabled = true;

  await new Promise(r => setTimeout(r, 700));

  let users = [];
  try {
    users = JSON.parse(localStorage.getItem("users") || "[]");
  } catch (err) { users = []; }

  const user = users.find(u =>
    (u.email || "").toLowerCase() === email &&
    u.password === password
  );

  if (!user) {
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 600);
    showStatus("statusMsg", "Invalid email or password. Try again.", "error");
    btn.classList.remove("loading");
    btn.disabled = false;
    document.getElementById("email").disabled = false;
    document.getElementById("pass").disabled = false;
    return;
  }

  currentUser = {
    name: user.name || user.username || "User",
    email: user.email,
    avatar: user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(user.email)}`
  };

  generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
  console.log("Generated OTP:", generatedOtp);

  showOtpStep();

  btn.classList.remove("loading");
  btn.disabled = false;
  document.getElementById("email").disabled = false;
  document.getElementById("pass").disabled = false;
});

/* ================= SHOW OTP STEP ================= */
function showOtpStep() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("linksSection").style.display = "none";
  document.getElementById("otpForm").classList.add("show");
  document.getElementById("cardSubtitle").textContent = "Enter the 6-digit code";
  document.getElementById("demoOtpDisplay").textContent = generatedOtp;

  setTimeout(() => {
    const first = document.querySelector('#otpInputs input[data-index="0"]');
    if (first) first.focus();
  }, 200);

  startResendTimer();
}

/* ================= BACK TO LOGIN ================= */
function backToLogin() {
  document.getElementById("otpForm").classList.remove("show");
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("linksSection").style.display = "block";
  document.getElementById("cardSubtitle").textContent = "Secure access to your classroom";
  document.querySelectorAll("#otpInputs input").forEach(i => {
    i.value = "";
    i.classList.remove("filled");
  });
  hideStatus("otpStatusMsg");

  if (resendTimer) clearInterval(resendTimer);
  generatedOtp = "";
  currentUser = null;
}

/* ================= OTP INPUT BOXES ================= */
const otpInputs = document.querySelectorAll("#otpInputs input");

otpInputs.forEach((input, idx) => {
  input.addEventListener("input", (e) => {
    const val = e.target.value.replace(/[^0-9]/g, "");
    e.target.value = val.slice(0, 1);
    e.target.classList.toggle("filled", e.target.value !== "");
    if (val && idx < otpInputs.length - 1) {
      otpInputs[idx + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !e.target.value && idx > 0) {
      otpInputs[idx - 1].focus();
      otpInputs[idx - 1].value = "";
      otpInputs[idx - 1].classList.remove("filled");
    }
    if (e.key === "ArrowLeft" && idx > 0) otpInputs[idx - 1].focus();
    if (e.key === "ArrowRight" && idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
  });

  input.addEventListener("paste", (e) => {
    e.preventDefault();
    const pasted = (e.clipboardData.getData("text") || "").replace(/[^0-9]/g, "").slice(0, 6);
    if (!pasted) return;
    otpInputs.forEach((inp, i) => {
      inp.value = pasted[i] || "";
      inp.classList.toggle("filled", inp.value !== "");
    });
    const next = Math.min(pasted.length, otpInputs.length - 1);
    otpInputs[next].focus();
  });
});

/* ================= VERIFY OTP ================= */
document.getElementById("otpForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideStatus("otpStatusMsg");

  const entered = Array.from(otpInputs).map(i => i.value).join("");

  if (entered.length !== 6) {
    showStatus("otpStatusMsg", "Please enter all 6 digits", "error");
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 600);
    return;
  }

  const btn = document.getElementById("verifyBtn");
  btn.classList.add("loading");
  btn.disabled = true;

  await new Promise(r => setTimeout(r, 700));

  if (entered !== generatedOtp) {
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 600);
    showStatus("otpStatusMsg", "Incorrect OTP. Please try again.", "error");
    otpInputs.forEach(i => {
      i.value = "";
      i.classList.remove("filled");
    });
    otpInputs[0].focus();
    btn.classList.remove("loading");
    btn.disabled = false;
    return;
  }

  localStorage.setItem("user", JSON.stringify(currentUser));
  localStorage.setItem("loggedUser", JSON.stringify(currentUser));
  localStorage.setItem("session_token", "token_" + Date.now());

  if (document.getElementById("rememberMe").checked) {
    localStorage.setItem("remember_me", "true");
  } else {
    localStorage.removeItem("remember_me");
  }

  showStatus("otpStatusMsg", "Verified! Redirecting...", "success");

  setTimeout(() => {
    window.location.href = "index.html";
  }, 900);
});

/* ================= RESEND TIMER ================= */
function startResendTimer() {
  let seconds = 30;
  const timerEl = document.getElementById("otpTimer");
  const resendLink = document.getElementById("resendLink");

  resendLink.classList.add("disabled");
  timerEl.style.display = "inline";

  if (resendTimer) clearInterval(resendTimer);

  resendTimer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(resendTimer);
      timerEl.style.display = "none";
      resendLink.classList.remove("disabled");
    } else {
      timerEl.innerHTML = `Resend in <strong>${seconds}</strong>s`;
    }
  }, 1000);

  timerEl.innerHTML = `Resend in <strong>${seconds}</strong>s`;
}

/* ================= RESEND OTP ================= */
function resendOtp() {
  if (document.getElementById("resendLink").classList.contains("disabled")) return;

  generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
  document.getElementById("demoOtpDisplay").textContent = generatedOtp;
  console.log("Resent OTP:", generatedOtp);

  otpInputs.forEach(i => {
    i.value = "";
    i.classList.remove("filled");
  });
  otpInputs[0].focus();

  hideStatus("otpStatusMsg");
  showStatus("otpStatusMsg", "New OTP generated!", "success");

  startResendTimer();
}

/* ================= FORGOT PASSWORD ================= */
function forgotPassword() {
  showStatus("statusMsg", "Password reset is coming soon. Contact support.", "error");
}

/* ================= AUTO-FILL REMEMBERED EMAIL ================= */
document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("remember_me") === "true") {
    try {
      const u = JSON.parse(localStorage.getItem("user") || "{}");
      if (u.email) {
        document.getElementById("email").value = u.email;
        document.getElementById("rememberMe").checked = true;
      }
    } catch (e) {}
  }
});
</script>
